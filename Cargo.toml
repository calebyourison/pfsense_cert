[package]
name = "pfsense_cert"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "blocking", "cookies"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = {version="1", features=["derive"]}
toml = "0.9"